# A complete persona, using every setting. Save it as ~/.swan/personas/<id>.yaml (the file name is
# its id: lowercase letters, digits and dashes) or build one in Settings → New persona. Edits apply
# immediately. It uses the connections in config.yaml next to this file.
name: Payments dev
description: Works on the payments service and reads the design docs

model:
  provider: copilot
  id: gpt-5             # an id from the model menu; your Copilot plan decides which exist
  effort: high          # low | medium | high | xhigh | max, where the model supports it
  maxTokens: 32000      # output limit per reply (Copilot sets its own)

instructions: |         # added to the system prompt
  Prefer small, reviewed changes. Run the tests before saying something works.

# All the agent can see of this Mac: these folders, under /workspace.
folders:
  - { path: ~/code/payments, mode: rw }                           # /workspace/payments, can change
  - { path: ~/docs/design, mount: /workspace/design, mode: ro }   # can read only

skills: [repo-tour]     # from ~/.swan/skills or skillDirs, mounted read-only at /skills/<name>

mcpServers:
  github:               # stdio: runs inside the sandbox and only ever sees a placeholder token
    command: npx
    args: [-y, "@modelcontextprotocol/server-github"]
    env: { GITHUB_PERSONAL_ACCESS_TOKEN: "{{credential:github/GITHUB_TOKEN}}" }
  # docs:               # http: called from this Mac, with the real value in the header
  #   url: https://docs.example.com/mcp
  #   headers: { Authorization: "Bearer {{credential:docs/DOCS_TOKEN}}" }

# Which credentials the agent may use, and for what. Deny wins over ask, ask over allow; a request
# no rule matches goes out with the placeholder (so it fails) and Swan offers to add a rule.
connections:
  github:
    rules:
      - credential: GITHUB_TOKEN
        api: http       # http: "METHOD /path" (* within a segment, ** across); also kubernetes and aws
        allow: ["GET /**", "HEAD /**"]
        ask: ["POST /repos/*/*/issues", "POST /repos/*/*/pulls", "PATCH /repos/*/*/issues/*"]
        deny: ["DELETE /**", "PUT /repos/*/*/collaborators/**"]

env: { NODE_ENV: development }   # extra variables in the sandbox; never secrets (use credentials)

# Hosts the agent may reach, besides its credentials' hosts. With `proxy` in config.yaml, agents'
# traffic goes through it, except noProxy hosts.
network:
  allow: [registry.npmjs.org, pypi.org, files.pythonhosted.org]
  # On the company network: also allowed, and may resolve to private addresses (10.x, 172.16-31.x,
  # 192.168.x). Only you add these, here or in Settings; an "Allow" card never does.
  internal: [jira.example.com]
  # Hosts bound to this persona's credentials refuse requests carrying any other credential (a
  # token the agent found or was given). List a host here only if it needs one; never from a card.
  otherCredentials: []

subagents:
  agents:
    - { name: reviewer, model: copilot/gpt-5 }   # "provider/id", or "auto" to let the agent choose per task
  maxBackground: 4      # sub-agents running in the background at once
  maxTurns: 200         # model turns per sub-agent task

memory:
  autoBrief: true       # load saved memories at the start of each context
  briefTokens: 1500
  autoDream: true       # run /dream when a context rolls over and when a conversation goes quiet

# Tool permissions: deny > allow > ask > default. A rule is a tool name or glob (mcp__github__*), a
# command pattern such as "cd *" or "npm test*" (also written bash(cd *)), or tool(argument glob).
# A command that joins several (cd app && npm test) is allowed when every part is, and denied when
# any part is. A command's card can allow its program with any arguments ("ls *") until stopped,
# or always, which adds the rule here. "ls *" does not match a bare "ls"; bash(ls) does.
permissions:
  default: ask
  allow: [read_file, list_dir, glob, grep, load_skill, "cd *", "ls *", "git status*", "git diff*", "npm test*", "mcp__github__get_*", "mcp__github__list_*"]
  ask: [bash, write_file, edit_file, "mcp__github__create_*"]
  deny: ["mcp__github__delete_*", "mcp__github__merge_*"]

sandbox:
  cpus: 2
  memory: 4g
  pidsLimit: 512
  workdir: /workspace/payments   # where bash starts
  # image: registry.example.com/team/dev-tools:2026.10   # an image of your own; Swan adds its layer (docs/DESKTOP.md)
  # tools:                            # extra tools, built into this persona's image. No secrets here.
  #   packages: [postgresql-client]   # with the image's package manager
  #   install: |                      # runs as root in /tmp while the image builds, with sh -eu
  #     arch=$(dpkg --print-architecture)
  #     curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.2/bin/linux/$arch/kubectl"
  #     chmod +x /usr/local/bin/kubectl
