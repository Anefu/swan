# A complete ~/.swan/secrets.yaml (save it under that name), to go with config.yaml next to it.
# Keep it mode 0600 (Swan creates it that way). Edits apply immediately.
#
# No value here ever reaches an agent or the sandbox: agents see placeholders, and the egress proxy
# swaps in a value only where config.yaml and the persona's rules allow. You can also set keys and
# credentials in Swan settings (from the persona menu).

# Model-provider keys: plain names, matching apiKeySecret in config.yaml.
COPILOT_GITHUB_TOKEN: ""   # fine-grained PAT from your personal GitHub account, "Copilot Requests" permission
ANTHROPIC_API_KEY: ""

# Connection credentials: connection/NAME, for the connections in config.yaml.
github/GITHUB_TOKEN: ""    # fine-grained PAT limited to the repositories and permissions agents need
