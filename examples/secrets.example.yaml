# Swan secret values. This file is watched: edits apply immediately, no restart.
#
# Values never enter the sandbox. Credentials are defined as connections in config.yaml (which
# says where each may be sent); their values live here as connection/NAME. Inside a session, a
# credential a persona's rules name is a placeholder that the egress proxy swaps for the real
# value only on HTTPS requests to that credential's hosts, and only for requests the rules allow.
#
# You can also keep values in secrets.env: GITHUB__GITHUB_TOKEN=... (connection in capitals,
# dashes as underscores, then __ and the credential name).

# Model-provider keys are plain names, used by Swan itself and never by an agent.
# If left empty, Swan falls back to $ANTHROPIC_API_KEY or your `ant auth login` profile.
ANTHROPIC_API_KEY: ""

# OPENAI_API_KEY: sk-...

# GitHub Copilot (copilot provider): a fine-grained PAT from your personal account with the
# "Copilot Requests" permission.
# COPILOT_GITHUB_TOKEN: github_pat_...

# Used by the github-helper example persona (connection "github" in config.yaml).
github/GITHUB_TOKEN: ""
