# persona-harness credentials. This file is watched: edits apply immediately, no restart.
#
# Values never enter the sandbox. Inside a session, each credential a persona lists is an
# environment variable holding a placeholder (phs_NAME_xxxx); the egress proxy swaps in the
# real value only on HTTPS requests to that credential's `hosts`.
#
#   NAME:
#     value: the secret
#     hosts: [api.example.com, "*.example.com"]   # where the sandbox may use it (omit = host-side only)
#     inject: { header: Authorization, format: "Bearer {value}" }  # optional: add the header automatically
#
# You can also keep values in secrets.env (KEY=VALUE, with KEY__HOSTS=host1,host2).

# Used by the harness itself to call Claude. No hosts, so it is never usable from the sandbox.
# If left empty, the harness falls back to $ANTHROPIC_API_KEY or your `ant auth login` profile.
ANTHROPIC_API_KEY:
  value: ""

# OPENAI_API_KEY:
#   value: sk-...

# GitHub Copilot (copilot provider): a fine-grained PAT from your personal account with the
# "Copilot Requests" permission. Host-side only: never give it hosts or list it in a persona.
# COPILOT_GITHUB_TOKEN:
#   value: github_pat_...

# Used by the github-helper example persona.
GITHUB_TOKEN:
  value: ""
  hosts: [api.github.com]
