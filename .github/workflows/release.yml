# A tag vX.Y.Z on main builds Swan for Apple silicon and attaches it to a GitHub pre-release.
# The build is unsigned (ad-hoc); install.sh installs it without macOS blocking it, and
# docs/DESKTOP.md explains what signing will add.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks as CI, on Linux where CI runs them; the Mac job only packages the app.
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # nothing here starts Electron
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main and matches the app's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(node -p 'require("./apps/desktop/package.json").version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($version)"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundled server starts the way the app starts it
        run: pnpm --filter @ph/desktop smoke-server
      - name: Install script (shellcheck, ASCII only for macOS's bash 3.2)
        run: |
          shellcheck install.sh
          perl -ne 'if (/[^\x00-\x7F]/) { print "install.sh:$.: $_"; $bad = 1 } END { exit $bad }' install.sh

  build:
    name: Build Swan for macOS
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # electron-builder fetches its own copy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: The packaged app starts its server and shows the UI
        run: |
          SWAN_SMOKE_TEST=1 PH_HOME="$RUNNER_TEMP/swan-home" \
            apps/desktop/release/mac-arm64/Swan.app/Contents/MacOS/Swan
      - name: Checksums
        working-directory: apps/desktop/release
        run: shasum -a 256 Swan-*.dmg | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: swan-macos
          path: |
            apps/desktop/release/Swan-*.dmg
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish the pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swan-macos
          path: dist
      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Install or update Swan (Apple silicon, macOS 13 or later):

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Anefu/swan/main/install.sh | bash
          ```

          Or download the DMG below. It isn't signed by Apple, so macOS blocks the first open: allow it in
          System Settings → Privacy & Security → Open Anyway (or run `xattr -dr com.apple.quarantine /Applications/Swan.app`).
          Podman is required (`brew install podman`); Swan offers to set up its machine on first start.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Swan ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes

  # What users run: the install script installs the release just published, without quarantine.
  install:
    name: Install script installs the release
    needs: publish
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install into a temporary folder
        env:
          SWAN_APP_DIR: ${{ runner.temp }}/apps
          LANG: en_US.UTF-8 # as in Terminal; macOS's bash 3.2 parses differently in a UTF-8 locale
        run: |
          bash install.sh "$GITHUB_REF_NAME"
          app="$SWAN_APP_DIR/Swan.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::installed $version, expected ${GITHUB_REF_NAME#v}"; exit 1; }
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then echo "::error::the installed app is quarantined"; exit 1; fi
