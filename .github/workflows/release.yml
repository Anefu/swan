# A tag vX.Y.Z on main builds Swan for Apple silicon and the headless server for Linux (x64 and
# arm64), and attaches them to a GitHub pre-release with one SHA256SUMS.txt for all of them.
# The build is unsigned (ad-hoc); install.sh installs it without macOS blocking it, and
# docs/DESKTOP.md explains what signing will add.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks as CI, on Linux where CI runs them; the Mac job only packages the app.
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # nothing here starts Electron
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main and matches the app's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(node -p 'require("./apps/desktop/package.json").version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($version)"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundled server starts the way the app starts it
        run: pnpm --filter @ph/desktop smoke-server
      - name: Install scripts (shellcheck, ASCII only for macOS's bash 3.2)
        run: |
          shellcheck install.sh install-server.sh
          perl -ne 'if (/[^\x00-\x7F]/) { print "$ARGV:$.: $_"; $bad = 1 } close ARGV if eof; END { exit $bad }' install.sh install-server.sh

  build:
    name: Build Swan for macOS
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # electron-builder fetches its own copy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: The packaged app starts its server and shows the UI
        run: |
          SWAN_SMOKE_TEST=1 PH_HOME="$RUNNER_TEMP/swan-home" \
            apps/desktop/release/mac-arm64/Swan.app/Contents/MacOS/Swan
      - name: Checksums
        working-directory: apps/desktop/release
        run: shasum -a 256 Swan-*.dmg | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: swan-macos
          path: |
            apps/desktop/release/Swan-*.dmg
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error

  # The server alone, for Linux machines the app reaches over SSH (install-server.sh). Each arch is
  # built and started on its own runner.
  server-linux:
    name: Build the server for Linux (${{ matrix.arch }})
    needs: check
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # nothing here starts Electron
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package-server --arch ${{ matrix.arch }}
      - name: The package starts from its own launcher
        run: |
          mkdir "$RUNNER_TEMP/swan-server"
          tar -xzf apps/desktop/release/swan-server-*-linux-${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP/swan-server" --strip-components=1
          node apps/desktop/scripts/smoke-server.mjs --launcher "$RUNNER_TEMP/swan-server/bin/swan-server"
      - uses: actions/upload-artifact@v4
        with:
          name: swan-server-linux-${{ matrix.arch }}
          path: apps/desktop/release/swan-server-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the pre-release
    needs: [build, server-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: swan-*
          merge-multiple: true
          path: dist
      - name: One checksum file for every asset
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS.txt # the DMG is the one the Mac job checked
          sha256sum Swan-*.dmg swan-server-*.tar.gz | tee SHA256SUMS.txt
      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Install or update Swan (Apple silicon, macOS 13 or later):

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Anefu/swan/main/install.sh | bash
          ```

          Or download the DMG below. It isn't signed by Apple, so macOS blocks the first open: allow it in
          System Settings → Privacy & Security → Open Anyway (or run `xattr -dr com.apple.quarantine /Applications/Swan.app`).
          Podman is required (`brew install podman`); Swan offers to set up its machine on first start.

          Swan's server on its own, for a Linux machine (x86_64 or arm64) you reach over SSH:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Anefu/swan/main/install-server.sh | bash
          ```
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Swan ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes

  # What users run: the install script installs the release just published, without quarantine.
  install:
    name: Install script installs the release
    needs: publish
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install into a temporary folder
        env:
          SWAN_APP_DIR: ${{ runner.temp }}/apps
          LANG: en_US.UTF-8 # as in Terminal; macOS's bash 3.2 parses differently in a UTF-8 locale
        run: |
          bash install.sh "$GITHUB_REF_NAME"
          app="$SWAN_APP_DIR/Swan.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::installed $version, expected ${GITHUB_REF_NAME#v}"; exit 1; }
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then echo "::error::the installed app is quarantined"; exit 1; fi

  install-server:
    name: Server install script installs the release (Linux)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install, start and stop the server
        env:
          PH_HOME: ${{ runner.temp }}/swan-home
        run: |
          version=${GITHUB_REF_NAME#v}
          bash install-server.sh "$GITHUB_REF_NAME"
          bin="$HOME/.local/bin/swan-server"
          case "$(readlink -f "$bin")" in
            */swan-server/"$version"/bin/swan-server) ;;
            *) echo "::error::$bin does not point at $version"; exit 1 ;;
          esac
          "$bin" & pid=$!
          for _ in $(seq 1 60); do grep -Eqs '"port": [0-9]' "$PH_HOME/server.json" && break; sleep 1; done
          grep -q "\"version\": \"$version\"" "$PH_HOME/server.json" || { echo "::error::the server did not start as $version"; exit 1; }
          curl -fsS "http://127.0.0.1:$(jq .port "$PH_HOME/server.json")/" >/dev/null
          kill -TERM "$pid"
          wait "$pid"
