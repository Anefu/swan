# Phase 1 pilot: one trial each, to measure what a run really costs. Hard cap $40.
# Run with: pnpm bench run bench/campaigns/pilot.yaml --secrets ~/.persona-harness/secrets.yaml
name: pilot
cap: 40
trials: 1
cases:
  - ../cases/mem-pnpm-convention.yaml
  - ../cases/mem-correction.yaml
  - ../cases/cost-fix-sum.yaml
providers:
  anthropic: { type: anthropic, apiKeySecret: ANTHROPIC_API_KEY }
  # Open-weight models through OpenRouter, each pinned to one host. Fill in the model id, its host
  # and the live price for that host (USD per million tokens) from openrouter.ai before running.
  # openrouter:
  #   type: openai
  #   baseURL: https://openrouter.ai/api/v1
  #   apiKeySecret: OPENROUTER_API_KEY
  #   models:
  #     "<vendor>/<model>":
  #       contextTokens: 200000
  #       price: { input: 0.0, output: 0.0, cacheRead: 0.0 }
  #       extraBody: { provider: { order: ["<host>"], allow_fallbacks: false } }
configs:
  # 40k contexts force rollovers without long fills (a labelled local variant).
  - id: sonnet-full
    model: { provider: anthropic, id: claude-sonnet-5-5, effort: medium }
    rolloverStrategy: full
    contextTokens: 40000
  - id: sonnet-none
    model: { provider: anthropic, id: claude-sonnet-5-5, effort: medium }
    rolloverStrategy: none
    contextTokens: 40000
  # - id: open-full
  #   model: { provider: openrouter, id: "<vendor>/<model>" }
  #   rolloverStrategy: full
  #   contextTokens: 40000
