# A value corrected before work starts: the correction, not the first value, must be used.
id: mem-correction
suite: memory
tier: medium
description: The user sets a retry limit of 3, then corrects it to 5. After a disruption, the agent writes the helper with 5.
workspace: ../fixtures/node-app
variants: [rollover, restart, newConversation]
fill:
  - Read docs/architecture.md and docs/changelog.md in full with cat, then give me a one-paragraph summary of each.
  - Read docs/operations.md in full with cat and list its section headings.
  - Read docs/runbook.md in full with cat and tell me which module has the most retries.
stages:
  - say: We're going to add a retry helper in src/retry.js. Use a maximum of 3 attempts. Don't write any code yet.
  - say: "Correction: make that 5 attempts, not 3. Still no code yet."
  - break: true
  - say: Now write src/retry.js exporting an async retry(fn) that calls fn until it succeeds, with the attempt limit we agreed, in a constant named MAX_ATTEMPTS. Export MAX_ATTEMPTS too.
checks:
  - id: uses-corrected-limit
    file: { path: src/retry.js, matches: "MAX_ATTEMPTS\\s*=\\s*5\\b" }
  - id: module-loads
    command: { run: "node -e \"const m=require('./src/retry.js'); if (m.MAX_ATTEMPTS !== 5 || typeof m.retry !== 'function') process.exit(1)\"" }
  - id: decision-saved
    memory: { matches: "\\b5\\b", expect: some }
fake:
  "Use a maximum of 3 attempts":
    - { text: "Understood: at most 3 attempts. I'll wait before writing code." }
  "make that 5 attempts":
    - { tool: memory_propose, args: { content: "Retry helper: at most 5 attempts (the user corrected it from 3).", type: decision, origin: user, sources: [] } }
    - { text: "Got it: 5 attempts, not 3. No code yet." }
  "attempt limit we agreed":
    - tool: write_file
      args:
        path: /workspace/node-app/src/retry.js
        content: |
          const MAX_ATTEMPTS = 5;

          async function retry(fn) {
            let last;
            for (let i = 0; i < MAX_ATTEMPTS; i++) {
              try {
                return await fn();
              } catch (e) {
                last = e;
              }
            }
            throw last;
          }

          module.exports = { retry, MAX_ATTEMPTS };
    - { text: "Wrote src/retry.js with MAX_ATTEMPTS = 5." }
  "docs/architecture.md and docs/changelog.md":
    - { tool: bash, args: { command: "cd /workspace/node-app && cat docs/architecture.md docs/changelog.md" } }
    - { text: "Architecture: ten modules with bounded queues and backoff. Changelog: the same modules, tuned limits." }
  "docs/operations.md in full":
    - { tool: bash, args: { command: "cd /workspace/node-app && cat docs/operations.md" } }
    - { text: "The headings are the ten module sections." }
  "docs/runbook.md in full":
    - { tool: bash, args: { command: "cd /workspace/node-app && cat docs/runbook.md" } }
    - { text: "The module with the most retries is listed in the runbook above." }
